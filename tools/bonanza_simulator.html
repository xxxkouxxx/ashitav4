<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノマドモグボナンザ 購入記録</title>
  <style>
    :root {
      --bg:    #0d0d1a;
      --bg2:   #14142a;
      --bg3:   #0f0f20;
      --brd:   #2a2a44;
      --gold:  #c9a227;
      --gldt:  #f0d060;
      --text:  #ddd8c8;
      --dim:   #666;
      --t1c:   #f0d060;
      --t2c:   #a8b8ff;
      --t3c:   #e0a8a8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI','Noto Sans JP',sans-serif; min-height: 100vh; }

    /* ─── ヘッダー ─── */
    header {
      text-align: center;
      padding: 1.3rem 1rem .9rem;
      background: linear-gradient(180deg, #070712 0%, #14142a 100%);
      border-bottom: 2px solid var(--gold);
    }
    header h1 { font-size: 1.35rem; color: var(--gold); letter-spacing: .06em; }
    header p  { font-size: .75rem; color: var(--dim); margin-top: .2rem; }

    /* ─── メインレイアウト ─── */
    .main { max-width: 620px; margin: 0 auto; padding: 1.2rem 1rem 3rem; display: flex; flex-direction: column; gap: 1.2rem; }

    /* ─── ステップカード ─── */
    .step-card { background: var(--bg2); border: 1px solid var(--brd); border-radius: 10px; overflow: hidden; }
    .step-head {
      display: flex; align-items: center; gap: .65rem;
      padding: .65rem 1rem; background: var(--bg3); border-bottom: 1px solid var(--brd);
    }
    .step-num {
      background: var(--gold); color: #1a1200;
      width: 20px; height: 20px; border-radius: 50%;
      font-size: .72rem; font-weight: bold;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .step-title { font-size: .9rem; font-weight: bold; }
    .step-sub   { font-size: .7rem; color: var(--dim); margin-left: auto; }
    .step-body  { padding: .9rem 1rem; }

    /* ─── キャラ行 ─── */
    .char-rows { display: flex; flex-direction: column; gap: .45rem; margin-bottom: .7rem; }
    .char-row {
      display: grid;
      grid-template-columns: 1fr 64px 64px 30px;
      gap: .35rem; align-items: center;
    }
    input[type="text"] {
      background: var(--bg); border: 1px solid var(--brd);
      border-radius: 5px; color: var(--text);
      padding: .38rem .5rem; font-size: .88rem;
      outline: none; width: 100%; transition: border-color .15s;
    }
    input[type="text"]:focus { border-color: var(--gold); }
    .mi {
      font-family: 'Courier New', monospace;
      font-size: .95rem; text-align: center;
      letter-spacing: .08em; color: var(--gldt);
    }
    .mi::placeholder { color: #333; letter-spacing: 0; }
    .btn-rm {
      background: none; border: 1px solid #333; color: #555;
      border-radius: 4px; cursor: pointer; font-size: .7rem;
      height: 30px; transition: all .15s; padding: 0;
    }
    .btn-rm:hover { border-color: #884444; color: #cc6666; }

    /* ─── 共通ボタン群 ─── */
    .btn-add {
      background: none; border: 1px dashed var(--brd); color: var(--dim);
      border-radius: 6px; padding: .45rem; width: 100%;
      cursor: pointer; font-size: .82rem; transition: all .15s;
    }
    .btn-add:hover { border-color: var(--gold); color: var(--gold); }

    .btn-row { display: flex; gap: .5rem; margin-top: .65rem; }
    .btn-save, .btn-load {
      flex: 1; background: none; padding: .5rem .4rem;
      border-radius: 6px; cursor: pointer; font-size: .8rem;
      transition: all .15s; text-align: center;
    }
    .btn-save { border: 1px solid #5a7a5a; color: #88bb88; }
    .btn-save:hover { background: rgba(100,180,100,.1); }
    .btn-load { border: 1px solid #4a6a7a; color: #88aacc; display: block; }
    .btn-load:hover { background: rgba(100,150,200,.1); }

    /* ─── 当選番号入力 ─── */
    .win-row { display: flex; gap: .7rem; align-items: flex-end; flex-wrap: wrap; margin-bottom: .8rem; }
    .win-cell { display: flex; flex-direction: column; gap: .22rem; }
    .win-cell label { font-size: .67rem; color: var(--dim); }
    .wi {
      font-family: 'Courier New', monospace; font-size: 1.35rem;
      text-align: center; color: var(--gldt); letter-spacing: .12em;
      padding: .32rem .4rem; background: var(--bg);
      border: 2px solid var(--brd); border-radius: 6px;
      outline: none; transition: border-color .15s;
    }
    .wi:focus { border-color: var(--gold); }
    .wi3 { width: 78px; } .wi2 { width: 58px; } .wi1 { width: 40px; }
    .btn-verify {
      background: var(--gold); border: none; color: #1a1200;
      padding: .56rem 1.4rem; border-radius: 6px;
      cursor: pointer; font-size: .88rem; font-weight: bold;
      transition: all .15s; align-self: flex-end;
    }
    .btn-verify:hover { background: var(--gldt); }

    /* ─── 照合結果 ─── */
    .result-banner {
      background: #1a1a00; border: 1px solid var(--gold);
      border-radius: 7px; padding: .6rem 1rem;
      text-align: center; color: var(--gold);
      font-weight: bold; font-size: .9rem; margin-bottom: .6rem;
    }
    .result-table { width: 100%; border-collapse: collapse; font-size: .86rem; }
    .result-table th {
      background: var(--bg3); color: var(--dim); font-weight: normal;
      padding: .4rem .55rem; border-bottom: 1px solid var(--brd);
      font-size: .72rem; text-align: left;
    }
    .result-table td { padding: .42rem .55rem; border-bottom: 1px solid #1a1a2e; vertical-align: middle; }
    .result-table tr:last-child td { border-bottom: none; }
    .result-table td:first-child { color: var(--text); }
    .mc { font-family: 'Courier New', monospace; font-size: .9rem; }
    .r1 { color: var(--t1c); font-weight: bold; }
    .r2 { color: var(--t2c); font-weight: bold; }
    .r3 { color: var(--t3c); }
    .r4 { color: #3a3a55; }
    .tier-tag { font-size: .65rem; margin-left: .3rem; opacity: .8; }

    /* ─── 傾向分析（折りたたみ） ─── */
    details { background: var(--bg2); border: 1px solid var(--brd); border-radius: 10px; overflow: hidden; }
    details summary {
      padding: .7rem 1rem; cursor: pointer;
      font-size: .82rem; color: var(--dim);
      list-style: none; user-select: none; transition: color .15s;
    }
    details summary::-webkit-details-marker { display: none; }
    details summary::before { content: '▶  '; font-size: .6rem; }
    details[open] summary::before { content: '▼  '; }
    details summary:hover { color: var(--text); }
    .trend-inner { padding: 1rem; }

    /* 傾向分析内部スタイル */
    .trend-section { margin-bottom: 1.4rem; }
    .trend-section h2 { font-size: .85rem; color: var(--gold); margin-bottom: .65rem; }
    .history-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .history-table th, .history-table td { border: 1px solid var(--brd); padding: .35rem .55rem; }
    .history-table th { background: var(--bg3); color: var(--dim); font-weight: normal; }
    .num-hl { font-family: 'Courier New', monospace; color: var(--gldt); font-weight: bold; }
    .heatmap { display: flex; flex-direction: column; gap: .35rem; }
    .heatmap-row { display: flex; align-items: center; gap: .35rem; }
    .heatmap-lbl { width: 44px; font-size: .68rem; color: var(--dim); flex-shrink: 0; }
    .heatmap-cells { display: flex; gap: .18rem; flex-wrap: wrap; }
    .hm-cell { width: 34px; height: 34px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
    .hm-d { font-size: .85rem; font-weight: bold; }
    .hm-c { font-size: .52rem; opacity: .7; }
    .hm-0 { background: #111128; color: #444; }
    .hm-1 { background: #2a1f60; color: #9090d0; }
    .hm-2 { background: #6a4400; color: var(--gldt); }
    .badge { display: inline-block; padding: .13rem .45rem; border-radius: 4px; font-size: .75rem; margin: .1rem; }
    .badge.hot  { background: #3a2208; color: var(--gold); border: 1px solid var(--gold); }
    .badge.cold { background: #111128; color: #5060a0; border: 1px solid #2a2a50; }
    .insight-list { display: flex; flex-direction: column; gap: .45rem; }
    .insight-row { display: flex; gap: .7rem; align-items: baseline; background: #111128; border: 1px solid var(--brd); border-radius: 6px; padding: .45rem .7rem; }
    .insight-pos { font-size: .68rem; color: var(--dim); width: 68px; flex-shrink: 0; }
    .insight-body { font-size: .8rem; line-height: 1.5; }
    .insight-body em { color: var(--gold); font-style: normal; }
    .rec-box { display: flex; align-items: center; gap: .8rem; flex-wrap: wrap; margin-bottom: .6rem; }
    .rec-num { font-family: 'Courier New', monospace; font-size: 2rem; color: var(--gold); letter-spacing: .3em; }
    .btn-rec { background: none; border: 1px solid var(--gold); color: var(--gold); padding: .38rem .85rem; border-radius: 5px; cursor: pointer; font-size: .8rem; }
    .btn-rec:hover { background: rgba(201,162,39,.12); }
    .disclaimer { font-size: .7rem; color: var(--dim); line-height: 1.55; }

    /* ─── 番号選びサポートパネル ─── */
    .support-panel { margin: .55rem 0 0; }
    .support-toggle {
      width: 100%; background: none; border: 1px solid var(--brd);
      color: var(--dim); padding: .42rem .8rem; border-radius: 6px;
      cursor: pointer; font-size: .82rem; text-align: left; transition: all .15s;
    }
    .support-toggle:hover { border-color: var(--gold); color: var(--gold); }
    .support-body { background: var(--bg3); border: 1px solid var(--brd); border-top: none; border-radius: 0 0 6px 6px; padding: .75rem .85rem; }
    .support-section { margin-bottom: .75rem; }
    .support-section:last-child { margin-bottom: 0; }
    .support-hint { font-size: .7rem; color: var(--dim); margin-left: .5rem; }
    .btn-auto {
      background: none; border: 1px solid var(--gold); color: var(--gold);
      padding: .42rem 1rem; border-radius: 5px; cursor: pointer; font-size: .82rem;
      transition: all .15s;
    }
    .btn-auto:hover { background: rgba(201,162,39,.12); }

    /* ─── 手動ピッカー ─── */
    .picker-row { display: flex; align-items: center; gap: .45rem; margin-bottom: .4rem; }
    .picker-lbl { font-size: .68rem; color: var(--dim); width: 40px; flex-shrink: 0; }
    .picker-digits { display: flex; gap: .2rem; flex-wrap: wrap; }
    .pd-btn {
      width: 36px; height: 36px; border-radius: 4px; border: 1px solid #2a2a44;
      cursor: pointer; font-size: .82rem; font-weight: bold;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      transition: all .12s; font-family: 'Courier New', monospace;
    }
    .pd-btn small { font-size: .5rem; font-family: sans-serif; font-weight: normal; opacity: .6; }
    .pd-f0 { background: #111128; color: #444; }
    .pd-f1 { background: #1e1e40; color: #9090d0; }
    .pd-f2 { background: #3a2808; color: var(--gold); }
    .pd-f3 { background: #6a4400; color: var(--gldt); }
    .pd-btn.chosen { border-color: var(--gold); box-shadow: 0 0 8px rgba(201,162,39,.5); transform: scale(1.08); }
    .pd-btn:hover:not(.chosen) { border-color: #555; }

    .picker-preview-row { display: flex; align-items: center; gap: .5rem; margin-top: .5rem; padding-top: .5rem; border-top: 1px solid var(--brd); flex-wrap: wrap; }
    .picker-preview { font-family: 'Courier New', monospace; font-size: 1.5rem; color: var(--gold); letter-spacing: .25em; min-width: 80px; }
    .btn-apply-pick {
      background: var(--gold); border: none; color: #1a1200;
      padding: .38rem .9rem; border-radius: 5px; cursor: pointer; font-size: .8rem; font-weight: bold;
    }
    .btn-apply-pick:disabled { opacity: .35; cursor: not-allowed; }
    .btn-clear-pick {
      background: none; border: 1px solid #444; color: #666;
      padding: .35rem .7rem; border-radius: 5px; cursor: pointer; font-size: .75rem;
    }

    @media (max-width: 440px) {
      .char-row { grid-template-columns: 1fr 58px 58px 28px; }
      .win-row { gap: .45rem; }
      .wi3 { width: 68px; } .wi2 { width: 52px; } .wi1 { width: 36px; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚔️ ノマドモグボナンザ 購入記録</h1>
  <p>24周年記念（2026年）FF11 モグボナンザ</p>
</header>

<div class="main">

  <!-- STEP 1: 購入番号を入力 -->
  <div class="step-card">
    <div class="step-head">
      <div class="step-num">1</div>
      <div class="step-title">購入番号を入力</div>
      <div class="step-sub">販売期間 5/14〜5/26 ／ 1キャラ最大2個</div>
    </div>
    <div class="step-body">
      <div class="char-rows" id="charList"></div>
      <button class="btn-add" onclick="addChar()">＋ キャラクターを追加</button>

      <!-- 番号選びサポート（折りたたみ） -->
      <div class="support-panel" id="supportPanel">
        <button class="support-toggle" onclick="toggleSupport()">
          🎯 番号選びサポート <span id="supportArrow">▼</span>
        </button>
        <div class="support-body" id="supportBody" style="display:none">
          <div class="support-section">
            <button class="btn-auto" onclick="autoFill()">✨ 傾向ランダムで自動生成</button>
            <span class="support-hint">過去13回の出現頻度を重みにランダム選択</span>
          </div>
          <div class="support-section">
            <div class="picker-rows" id="pickerRows"></div>
            <div class="picker-preview-row">
              <div class="picker-preview" id="pickerPreview">? ? ?</div>
              <button class="btn-apply-pick" onclick="applyPick()" id="btnApplyPick" disabled>この番号を使う</button>
              <button class="btn-clear-pick" onclick="clearPick()">クリア</button>
            </div>
          </div>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn-save" onclick="exportMarkdown()">📋 Markdownで保存</button>
        <label class="btn-load" for="mdFileInput">📂 ファイルから読み込む</label>
        <input type="file" id="mdFileInput" accept=".md,.txt" onchange="importMarkdown(event)" style="display:none">
      </div>
    </div>
  </div>

  <!-- STEP 2: 当選番号で照合（6/24以降） -->
  <div class="step-card">
    <div class="step-head">
      <div class="step-num">2</div>
      <div class="step-title">当選番号で照合</div>
      <div class="step-sub">📅 2026/6/24 発表後に使用</div>
    </div>
    <div class="step-body">
      <div class="win-row">
        <div class="win-cell">
          <label>1等（全3桁）</label>
          <input type="text" id="win1" class="wi wi3" maxlength="3" placeholder="000" inputmode="numeric">
        </div>
        <div class="win-cell">
          <label>2等（下2桁）</label>
          <input type="text" id="win2" class="wi wi2" maxlength="2" placeholder="00" inputmode="numeric">
        </div>
        <div class="win-cell">
          <label>3等（下1桁）</label>
          <input type="text" id="win3" class="wi wi1" maxlength="1" placeholder="0" inputmode="numeric">
        </div>
        <button class="btn-verify" onclick="startVerify()">照合する</button>
      </div>
      <div id="resultSec"></div>
    </div>
  </div>

  <!-- 傾向分析（折りたたみ） -->
  <details>
    <summary>📊 傾向分析（参考：過去13回データ）</summary>
    <div class="trend-inner">
      <div id="trendBody"></div>
    </div>
  </details>

</div>

<script>
'use strict';

// ── 定数 ──────────────────────────────────────

const HISTORY = [
  { year:'第3回 新春2021',  first:'397', second:'79', third:'1' },
  { year:'第4回 早春2021',  first:'196', second:'37', third:'0' },
  { year:'第5回 19周年',    first:'596', second:'22', third:'4' },
  { year:'第6回 真夏2021',  first:'230', second:'44', third:'7' },
  { year:'第7回 新春2022',  first:'032', second:'88', third:'1' },
  { year:'第8回 20周年',    first:'854', second:'04', third:'7' },
  { year:'第9回 新春2023',  first:'109', second:'62', third:'9' },
  { year:'第10回 21周年',   first:'800', second:'71', third:'7' },
  { year:'第11回 新春2024', first:'594', second:'39', third:'5' },
  { year:'第12回 22周年',   first:'789', second:'77', third:'4' },
  { year:'第13回 新春2025', first:'635', second:'27', third:'1' },
  { year:'第14回 23周年',   first:'508', second:'08', third:'0' },
  { year:'第15回 新春2026', first:'021', second:'50', third:'9' },
];

// ── ユーティリティ ──────────────────────────────

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── キャラ管理 ─────────────────────────────────

let uid = 0;

function addChar(name = '', m1 = '', m2 = '') {
  const id = uid++;
  const div = document.createElement('div');
  div.className = 'char-card char-row';
  div.id = `char-${id}`;
  div.innerHTML = `
    <input class="char-name-input" type="text" placeholder="キャラ名" value="${escHtml(name)}">
    <input class="marble-input mi" type="text" maxlength="3" placeholder="玉①" inputmode="numeric" value="${escHtml(m1)}">
    <input class="marble-input mi" type="text" maxlength="3" placeholder="玉②" inputmode="numeric" value="${escHtml(m2)}">
    <button class="btn-rm" onclick="removeChar(${id})">✕</button>`;
  div.querySelectorAll('.marble-input').forEach(el => {
    el.addEventListener('input', () => { el.value = el.value.replace(/\D/g,'').slice(0,3); });
  });
  document.getElementById('charList').appendChild(div);
}

function removeChar(id) {
  const el = document.getElementById(`char-${id}`);
  if (el) el.remove();
}

// ── 等級判定 ────────────────────────────────────
// w1=1等3桁, w2=2等下2桁, w3=3等下1桁（独立した当選番号）

function checkTier(marble, w1, w2, w3) {
  const m = marble.padStart(3,'0');
  if (m === w1)          return 1;
  if (m.slice(1) === w2) return 2;
  if (m[2] === w3)       return 3;
  return 4;
}

// ── 照合 ────────────────────────────────────────

function startVerify() {
  const chars = document.querySelectorAll('.char-card');
  if (!chars.length) { alert('キャラクターを追加してください'); return; }

  const r1 = document.getElementById('win1').value.trim();
  const r2 = document.getElementById('win2').value.trim();
  const r3 = document.getElementById('win3').value.trim();
  if (!/^\d{1,3}$/.test(r1)) { alert('1等番号（全3桁）を入力してください'); return; }
  if (!/^\d{1,2}$/.test(r2)) { alert('2等番号（下2桁）を入力してください'); return; }
  if (!/^\d$/.test(r3))      { alert('3等番号（下1桁）を入力してください'); return; }

  showResults(r1.padStart(3,'0'), r2.padStart(2,'0'), r3);
}

function showResults(w1, w2, w3) {
  const sec = document.getElementById('resultSec');
  sec.innerHTML = '';
  let hits = 0;

  // キャラごとに1行
  const rows = [];
  document.querySelectorAll('.char-card').forEach(card => {
    const name = card.querySelector('.char-name-input').value.trim() || '名前なし';
    const [inp1, inp2] = card.querySelectorAll('.marble-input');
    const marbles = [inp1?.value.trim(), inp2?.value.trim()];
    rows.push({ name, marbles });
  });

  const tbody = rows.map(({ name, marbles }) => {
    const cells = marbles.map(v => {
      if (!v) return '<td class="r4">─</td>';
      const m    = v.padStart(3,'0');
      const tier = checkTier(m, w1, w2, w3);
      if (tier < 4) hits++;
      const cls  = ['','r1','r2','r3','r4'][tier];
      const label = ['','1等','2等','3等','─'][tier];
      const markedM = markedHtml(m, tier);
      return `<td class="${cls} mc">${markedM}<span class="tier-tag">${label}</span></td>`;
    }).join('');
    return `<tr><td>${escHtml(name)}</td>${cells}</tr>`;
  }).join('');

  sec.innerHTML = `
    <table class="result-table">
      <thead><tr><th>キャラ</th><th>玉①</th><th>玉②</th></tr></thead>
      <tbody>${tbody}</tbody>
    </table>`;

  if (hits > 0) {
    const banner = document.createElement('div');
    banner.className = 'result-banner';
    banner.textContent = `🎉 ${hits}個 当選しています！`;
    sec.prepend(banner);
  }
}

function markedHtml(marble, tier) {
  const m = marble.padStart(3,'0');
  if (tier === 1) return `<strong>${m}</strong>`;
  if (tier === 2) return `<span style="opacity:.4">${m[0]}</span><strong>${m.slice(1)}</strong>`;
  if (tier === 3) return `<span style="opacity:.4">${m.slice(0,2)}</span><strong>${m[2]}</strong>`;
  return `<span style="opacity:.35">${m}</span>`;
}

// ── Markdownエクスポート ────────────────────────

function exportMarkdown() {
  const now     = new Date();
  const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const fname   = `bonanza_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.md`;

  const chars = [];
  document.querySelectorAll('.char-card').forEach(card => {
    const name    = card.querySelector('.char-name-input').value.trim() || '（名前なし）';
    const inputs  = card.querySelectorAll('.marble-input');
    const marble1 = inputs[0]?.value.trim() ? inputs[0].value.trim().padStart(3,'0') : null;
    const marble2 = inputs[1]?.value.trim() ? inputs[1].value.trim().padStart(3,'0') : null;
    chars.push({ name, marble1, marble2 });
  });

  if (!chars.some(c => c.marble1 || c.marble2)) { alert('玉番号が入力されていません'); return; }

  const tableRows = chars.map(c =>
    `| ${c.name} | ${c.marble1 ? `\`${c.marble1}\`` : '─'} | ${c.marble2 ? `\`${c.marble2}\`` : '─'} |`
  ).join('\n');

  const freq    = digitFreq();
  const posLbl  = ['百の位','十の位','一の位'];
  const trendLines = freq.map((f, pi) => {
    const max = Math.max(...Object.values(f));
    const hot = Object.keys(f).filter(k => f[k] === max && max > 0);
    const pct = Math.round(max / HISTORY.length * 100);
    return `- ${posLbl[pi]}: \`${hot.join(' / ')}\` が最頻出（${max}/${HISTORY.length}回, ${pct}%）`;
  }).join('\n');

  const md = `# ノマドモグボナンザ 購入記録

**イベント:** 24周年記念ノマドモグボナンザ
**販売期間:** 2026/05/14 〜 05/26
**当選番号発表:** 2026/06/24
**エクスポート:** ${dateStr} ${timeStr}

---

## 購入番号

| キャラ | 玉① | 玉② |
|--------|------|------|
${tableRows}

---

## 傾向分析メモ（参考 / 全${HISTORY.length}回データ）

${trendLines}

> ⚠️ 傾向データはエンタメ目的です。抽選は真のランダムであり予測はできません。

---

## 過去の当選番号

| 回 | 1等（全3桁） | 2等（下2桁） | 3等（下1桁） |
|----|------------|------------|------------|
${HISTORY.map(h => `| ${h.year} | \`${h.first}\` | ${h.second} | ${h.third} |`).join('\n')}
`;

  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href = url; a.download = fname; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ── Markdownインポート ──────────────────────────

function importMarkdown(event) {
  const file = event.target.files[0];
  if (!file) return;
  event.target.value = '';
  const reader = new FileReader();
  reader.onload = e => parseAndLoadMarkdown(e.target.result);
  reader.readAsText(file, 'UTF-8');
}

function parseAndLoadMarkdown(text) {
  const section = text.match(/## 購入番号\n([\s\S]*?)(?:\n##|$)/);
  if (!section) { alert('購入番号セクションが見つかりませんでした'); return; }

  const rows = section[1]
    .split('\n')
    .filter(l => /^\|/.test(l) && !/^\|\s*[-|]+\s*$/.test(l) && !/キャラ/.test(l));

  if (!rows.length) { alert('購入番号が見つかりませんでした'); return; }

  document.getElementById('charList').innerHTML = '';
  rows.forEach(row => {
    const cells = row.split('|').map(c => c.trim()).filter(c => c.length);
    if (!cells.length) return;
    const name = cells[0] || '';
    const m1 = (cells[1] || '').replace(/`|─|—/g, '').trim();
    const m2 = (cells[2] || '').replace(/`|─|—/g, '').trim();
    addChar(name, /^\d+$/.test(m1) ? m1 : '', /^\d+$/.test(m2) ? m2 : '');
  });
  alert(`✅ ${rows.length}キャラのデータを読み込みました`);
}

// ── 傾向分析 ────────────────────────────────────

function digitFreq() {
  const freq = [{},{},{}];
  for (let d = 0; d <= 9; d++) [0,1,2].forEach(i => { freq[i][d] = 0; });
  HISTORY.forEach(h => {
    h.first.padStart(3,'0').split('').forEach((ch, i) => { freq[i][ch] = (freq[i][ch]||0) + 1; });
  });
  return freq;
}

// 傾向分析 details が開かれたときに1回だけビルド
let trendBuilt = false;
document.querySelector('details').addEventListener('toggle', function() {
  if (this.open && !trendBuilt) { buildTrend(); trendBuilt = true; }
});

function buildTrend() {
  const freq   = digitFreq();
  const posLbl = ['百の位','十の位','一の位'];
  const maxF   = Math.max(...freq.flatMap(f => Object.values(f)));
  const n      = HISTORY.length;

  const histRows = HISTORY.map(h =>
    `<tr><td>${h.year}</td><td><span class="num-hl">${h.first}</span></td><td>${h.second}</td><td>${h.third}</td></tr>`
  ).join('');

  const hmRows = freq.map((f, pi) => {
    const cells = Object.entries(f).map(([d, cnt]) => {
      const ratio = maxF > 0 ? cnt / maxF : 0;
      const cls   = ratio === 0 ? 'hm-0' : ratio <= .5 ? 'hm-1' : 'hm-2';
      return `<div class="hm-cell ${cls}"><span class="hm-d">${d}</span><span class="hm-c">${cnt}回</span></div>`;
    }).join('');
    return `<div class="heatmap-row"><span class="heatmap-lbl">${posLbl[pi]}</span><div class="heatmap-cells">${cells}</div></div>`;
  }).join('');

  const hcHtml = freq.map((f, pi) => {
    const max  = Math.max(...Object.values(f));
    const hot  = Object.keys(f).filter(k => f[k] === max && max > 0);
    const cold = Object.keys(f).filter(k => f[k] === 0);
    const coldDisp = cold.length > 5
      ? cold.slice(0,5).map(d=>`<span class="badge cold">❄ ${d}</span>`).join('') + `<span style="font-size:.7rem;color:var(--dim)"> 他${cold.length-5}個</span>`
      : cold.map(d=>`<span class="badge cold">❄ ${d}</span>`).join('');
    return `<div style="margin-bottom:.55rem">
      <span style="font-size:.75rem;color:var(--dim)">${posLbl[pi]}：</span>
      ${hot.map(d=>`<span class="badge hot">🔥 ${d}</span>`).join('')}
      ${coldDisp}
    </div>`;
  }).join('');

  const insightItems = [];
  freq.forEach((f, pi) => {
    const max = Math.max(...Object.values(f));
    const hot = Object.keys(f).filter(k => f[k] === max);
    const pct = Math.round(max / n * 100);
    if (max >= 2) {
      insightItems.push(`<div class="insight-row">
        <span class="insight-pos">${posLbl[pi]}</span>
        <span class="insight-body"><strong style="color:var(--gldt)">${hot.join(' / ')}</strong> が ${max}/${n}回 <em>(${pct}%)</em> — 理論値(10%)の約${(pct/10).toFixed(1)}倍</span>
      </div>`);
    }
  });
  const thirdFreq = {};
  for (let d=0; d<=9; d++) thirdFreq[d] = 0;
  HISTORY.forEach(h => { thirdFreq[h.third.slice(-1)]++; });
  const thirdMax = Math.max(...Object.values(thirdFreq));
  const thirdHot = Object.keys(thirdFreq).filter(k => thirdFreq[k] === thirdMax);
  insightItems.push(`<div class="insight-row">
    <span class="insight-pos">3等(一の位)</span>
    <span class="insight-body"><strong style="color:var(--t3c)">${thirdHot.join(' / ')}</strong> が各${thirdMax}回 — 下1桁の参考に</span>
  </div>`);

  document.getElementById('trendBody').innerHTML = `
    <div class="trend-section">
      <h2>📋 過去の当選番号</h2>
      <table class="history-table">
        <thead><tr><th>回</th><th>1等（全3桁）</th><th>2等（下2桁）</th><th>3等（下1桁）</th></tr></thead>
        <tbody>${histRows}</tbody>
      </table>
    </div>
    <div class="trend-section">
      <h2>🌡 桁別出現頻度（1等 全${n}回）</h2>
      <div class="heatmap">${hmRows}</div>
    </div>
    <div class="trend-section">
      <h2>🔥 ホット / ❄ コールド</h2>
      ${hcHtml}
    </div>
    <div class="trend-section">
      <h2>💡 インサイト</h2>
      <div class="insight-list">${insightItems.join('')}</div>
    </div>
    <div class="trend-section">
      <h2>🎯 傾向ベースのおすすめ番号</h2>
      <div class="rec-box">
        <span class="rec-num" id="recNum">─ ─ ─</span>
        <button class="btn-rec" onclick="genRec()">生成する</button>
      </div>
      <div class="disclaimer">⚠️ このデータはエンタメ目的です。ボナンザの抽選は真のランダムであり、過去の番号は次回の結果に一切影響しません。</div>
    </div>`;
}

function genRec() {
  const freq = digitFreq();
  const rec  = freq.map(f => {
    const max = Math.max(...Object.values(f));
    const hot = Object.keys(f).filter(k => f[k] === max);
    return hot[Math.floor(Math.random() * hot.length)];
  }).join('');
  document.getElementById('recNum').textContent = rec.split('').join(' ');
}

// ── 番号選びサポート ─────────────────────────────

function weightedRandom(freq) {
  const entries = Object.entries(freq);
  const total   = entries.reduce((s, [, v]) => s + v + 0.5, 0);
  let r = Math.random() * total;
  for (const [d, cnt] of entries) {
    r -= (cnt + 0.5);
    if (r <= 0) return d;
  }
  return entries[entries.length - 1][0];
}

function fillNextMarble(num) {
  const inputs = document.querySelectorAll('.marble-input');
  for (const inp of inputs) {
    if (!inp.value.trim()) {
      inp.value = num;
      flash(inp);
      return;
    }
  }
  const last = inputs[inputs.length - 1];
  if (last) { last.value = num; flash(last); }
}

function flash(el) {
  el.style.transition = 'box-shadow .3s';
  el.style.boxShadow  = '0 0 10px rgba(201,162,39,.8)';
  setTimeout(() => { el.style.boxShadow = ''; }, 700);
}

function autoFill() {
  const freq = digitFreq();
  const num  = freq.map(f => weightedRandom(f)).join('');
  fillNextMarble(num);
}

// ── 手動ピッカー ─────────────────────────────────

const pickerSel = [null, null, null];

function toggleSupport() {
  const body  = document.getElementById('supportBody');
  const arrow = document.getElementById('supportArrow');
  const open  = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  arrow.textContent  = open ? '▼' : '▲';
  if (!open && !document.getElementById('pickerRows').hasChildNodes()) buildPickerUI();
}

function buildPickerUI() {
  const freq    = digitFreq();
  const posLbls = ['百の位', '十の位', '一の位'];

  document.getElementById('pickerRows').innerHTML = posLbls.map((lbl, pi) => {
    const sorted = Object.entries(freq[pi]).sort((a, b) => b[1] - a[1] || +a[0] - +b[0]);
    const btns = sorted.map(([d, cnt]) => {
      const lvl = cnt === 0 ? 0 : cnt <= 1 ? 1 : cnt <= 2 ? 2 : 3;
      return `<button class="pd-btn pd-f${lvl}" data-pos="${pi}" data-d="${d}"
                onclick="pickDigit(${pi},'${d}')">${d}<small>${cnt}回</small></button>`;
    }).join('');
    return `<div class="picker-row"><span class="picker-lbl">${lbl}</span><div class="picker-digits" id="pdr${pi}">${btns}</div></div>`;
  }).join('');
}

function pickDigit(pos, d) {
  pickerSel[pos] = pickerSel[pos] === d ? null : d;
  document.querySelectorAll(`#pdr${pos} .pd-btn`).forEach(b =>
    b.classList.toggle('chosen', b.dataset.d === pickerSel[pos]));
  updatePickerPreview();
}

function updatePickerPreview() {
  const txt = pickerSel.map(v => v !== null ? v : '?').join(' ');
  document.getElementById('pickerPreview').textContent = txt;
  document.getElementById('btnApplyPick').disabled = pickerSel.every(v => v === null);
}

function applyPick() {
  const num = pickerSel.map(v => v !== null ? v : String(Math.floor(Math.random() * 10))).join('');
  fillNextMarble(num);
}

function clearPick() {
  pickerSel.fill(null);
  document.querySelectorAll('.pd-btn').forEach(b => b.classList.remove('chosen'));
  updatePickerPreview();
  document.getElementById('btnApplyPick').disabled = true;
}

// ── 初期化 ──────────────────────────────────────
addChar();
</script>
