<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ノマドモグボナンザ 購入番号サポート</title>
  <style>
    :root {
      --bg:        #0d0d1a;
      --bg2:       #1a1a30;
      --gold:      #c9a227;
      --gold-lt:   #f0d060;
      --silver:    #a0a8c0;
      --bronze:    #cd7f32;
      --text:      #e8e0d0;
      --text-dim:  #777;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
      min-height: 100vh;
    }

    /* ─── ヘッダー ─── */
    header {
      text-align: center;
      padding: 1.8rem 1rem 1.2rem;
      background: linear-gradient(180deg, #070712 0%, #1a1a30 100%);
      border-bottom: 2px solid var(--gold);
    }
    header h1 {
      font-size: 1.7rem;
      color: var(--gold);
      text-shadow: 0 0 24px rgba(201,162,39,.55);
      letter-spacing: .08em;
    }
    header p { color: var(--text-dim); font-size: .82rem; margin-top: .3rem; }

    /* ─── タブ ─── */
    .tabs {
      display: flex;
      justify-content: center;
      gap: .5rem;
      padding: .9rem 1rem;
      background: var(--bg2);
      border-bottom: 1px solid #2a2a44;
    }
    .tab-btn {
      padding: .55rem 1.4rem;
      border: 1px solid var(--gold);
      background: transparent;
      color: var(--gold);
      cursor: pointer;
      border-radius: 4px;
      font-size: .88rem;
      transition: all .18s;
    }
    .tab-btn.active { background: var(--gold); color: #1a0a00; font-weight: bold; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .container { max-width: 860px; margin: 0 auto; padding: 1.4rem 1rem; }

    /* ─── 情報バー ─── */
    .info-bar {
      background: #111128;
      border: 1px solid #2a2a44;
      border-radius: 6px;
      padding: .55rem 1rem;
      margin-bottom: 1.2rem;
      font-size: .78rem;
      color: var(--text-dim);
      display: flex;
      gap: 1.2rem;
      flex-wrap: wrap;
    }
    .info-bar strong { color: var(--text); }

    /* ─── キャラカード ─── */
    .char-list { display: flex; flex-direction: column; gap: .9rem; margin-bottom: 1.2rem; }

    .char-card {
      background: var(--bg2);
      border: 1px solid #2e2e50;
      border-radius: 8px;
      padding: .9rem;
    }
    .char-header {
      display: flex;
      align-items: center;
      gap: .7rem;
      margin-bottom: .75rem;
    }
    .char-name-input {
      background: #111128;
      border: 1px solid #3a3a60;
      color: var(--text);
      padding: .38rem .6rem;
      border-radius: 4px;
      font-size: .88rem;
      flex: 1;
    }
    .marbles-row { display: flex; gap: 1.2rem; flex-wrap: wrap; align-items: center; }
    .marble-group { display: flex; align-items: center; gap: .45rem; }
    .marble-label { font-size: .75rem; color: var(--text-dim); white-space: nowrap; }
    .marble-input {
      background: #111128;
      border: 2px solid var(--gold);
      color: var(--gold-lt);
      padding: .38rem .55rem;
      border-radius: 5px;
      font-size: 1.15rem;
      font-weight: bold;
      width: 78px;
      text-align: center;
      letter-spacing: .18em;
      font-family: 'Courier New', monospace;
    }
    .marble-input::placeholder { color: #444; letter-spacing: .05em; }

    .btn-remove {
      background: #3a0000;
      border: 1px solid #660000;
      color: #ff7070;
      padding: .28rem .55rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: .75rem;
    }
    .btn-add-char {
      background: transparent;
      border: 1px dashed var(--gold);
      color: var(--gold);
      padding: .55rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: .88rem;
      width: 100%;
      transition: all .2s;
    }
    .btn-add-char:hover { background: rgba(201,162,39,.08); }

    /* ─── 抽選ボタン ─── */
    .draw-section { text-align: center; margin: 1.6rem 0; }
    .btn-draw {
      background: linear-gradient(135deg, #a07010, #c9a227, #daa520, #c9a227, #a07010);
      border: none;
      color: #1a0800;
      padding: .95rem 3rem;
      font-size: 1.35rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      letter-spacing: .1em;
      box-shadow: 0 4px 20px rgba(201,162,39,.45);
      transition: all .2s;
    }
    .btn-draw:hover  { transform: scale(1.05); box-shadow: 0 6px 30px rgba(201,162,39,.65); }
    .btn-draw:active { transform: scale(.97); }
    .btn-draw:disabled { opacity: .45; cursor: not-allowed; transform: none; }

    /* ─── 当選番号表示 ─── */
    .winning-display { text-align: center; margin: 1.4rem 0 .6rem; }
    .winning-label { font-size: .82rem; color: var(--text-dim); margin-bottom: .5rem; letter-spacing: .1em; }
    .winning-digits { display: inline-flex; gap: .45rem; }
    .digit-box {
      width: 68px; height: 86px;
      background: #0e0e22;
      border: 2px solid var(--gold);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      font-weight: bold;
      color: var(--gold-lt);
      text-shadow: 0 0 10px rgba(201,162,39,.6);
      font-family: 'Courier New', monospace;
    }
    .digit-box.spin { animation: flash .08s infinite; }
    @keyframes flash {
      0%,100% { color: var(--gold-lt); }
      50%      { color: #fff; text-shadow: 0 0 14px #fff; }
    }

    /* ─── 結果カード ─── */
    .results-section { display: flex; flex-direction: column; gap: .9rem; margin-top: .5rem; }
    .result-card {
      background: var(--bg2);
      border-radius: 8px;
      padding: .95rem 1rem;
      border-left: 4px solid #333;
    }
    .result-card.tier-1 {
      border-left-color: var(--gold);
      animation: jackGlow 1.6s ease-in-out infinite;
    }
    .result-card.tier-2 { border-left-color: var(--silver); }
    .result-card.tier-3 { border-left-color: var(--bronze); }
    .result-card.tier-4 { border-left-color: #3a3a3a; }

    @keyframes jackGlow {
      0%,100% { box-shadow: 0 0 16px rgba(201,162,39,.4); }
      50%      { box-shadow: 0 0 40px rgba(201,162,39,.85), 0 0 80px rgba(240,208,96,.3); }
    }

    .result-header { display: flex; align-items: center; gap: .8rem; margin-bottom: .75rem; flex-wrap: wrap; }
    .tier-badge {
      padding: .28rem .75rem;
      border-radius: 20px;
      font-weight: bold;
      font-size: .85rem;
      white-space: nowrap;
    }
    .tier-1 .tier-badge { background: var(--gold);   color: #1a0800; }
    .tier-2 .tier-badge { background: var(--silver);  color: #111; }
    .tier-3 .tier-badge { background: var(--bronze);  color: #1a0800; }
    .tier-4 .tier-badge { background: #333;           color: #888; }

    .marble-vs { font-family: monospace; font-size: 1rem; }

    .prize-grid { display: flex; flex-wrap: wrap; gap: .35rem; margin: .45rem 0; }
    .prize-chip {
      padding: .22rem .55rem;
      background: #1c1c38;
      border: 1px solid #3a3a60;
      border-radius: 4px;
      font-size: .78rem;
      cursor: pointer;
      transition: all .14s;
      user-select: none;
    }
    .prize-chip:hover   { background: #2a2a50; }
    .prize-chip.chosen  { background: var(--gold); color: #1a0800; border-color: var(--gold); font-weight: bold; }

    .btn-rand-prize {
      margin-top: .4rem;
      padding: .35rem .95rem;
      background: transparent;
      border: 1px solid var(--bronze);
      color: var(--bronze);
      border-radius: 4px;
      cursor: pointer;
      font-size: .8rem;
      transition: all .18s;
    }
    .btn-rand-prize:hover { background: rgba(205,127,50,.18); }

    /* ─── 傾向分析 ─── */
    .trend-section { margin-bottom: 2rem; }
    .trend-section h2 {
      font-size: 1.05rem;
      color: var(--gold);
      border-bottom: 1px solid #2a2a44;
      padding-bottom: .45rem;
      margin-bottom: .9rem;
    }

    .history-table { width: 100%; border-collapse: collapse; font-size: .88rem; }
    .history-table th {
      background: #1e1e3c;
      color: var(--gold);
      padding: .55rem .9rem;
      text-align: center;
    }
    .history-table td {
      border: 1px solid #2a2a44;
      padding: .55rem .9rem;
      text-align: center;
    }
    .history-table tr:nth-child(even) td { background: #14142a; }
    .num-hl { font-family: monospace; font-weight: bold; font-size: 1.1rem; color: var(--gold-lt); }

    /* ヒートマップ */
    .heatmap { display: flex; flex-direction: column; gap: .5rem; }
    .heatmap-row { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
    .heatmap-lbl { width: 58px; font-size: .75rem; color: var(--text-dim); text-align: right; flex-shrink: 0; }
    .heatmap-cells { display: flex; gap: .25rem; flex-wrap: wrap; }
    .hm-cell {
      width: 44px; height: 40px;
      border-radius: 5px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid #2a2a40;
      transition: transform .12s;
    }
    .hm-cell:hover { transform: scale(1.12); }
    .hm-cell .hm-d { font-weight: bold; font-size: .95rem; }
    .hm-cell .hm-c { font-size: .62rem; color: rgba(255,255,255,.55); }
    .hm-0 { background: #141428; }
    .hm-1 { background: #28205a; color: #aaa8ff; }
    .hm-2 { background: #6a4010; color: var(--gold-lt); }

    /* ホット/コールド */
    .badge {
      display: inline-block;
      padding: .2rem .55rem;
      border-radius: 12px;
      font-size: .78rem;
      margin: .18rem;
    }
    .badge.hot  { background: var(--gold);  color: #1a0800; }
    .badge.cold { background: #2a2a2a;      color: #777; }

    /* おすすめ番号 */
    .rec-box {
      background: #0e0e22;
      border: 2px solid var(--gold);
      border-radius: 8px;
      padding: 1rem;
      text-align: center;
    }
    .rec-num {
      display: block;
      font-size: 3rem;
      font-family: 'Courier New', monospace;
      font-weight: bold;
      color: var(--gold);
      letter-spacing: .4em;
      text-shadow: 0 0 20px rgba(201,162,39,.5);
      margin: .5rem 0;
    }
    .btn-rec {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      padding: .45rem 1.4rem;
      border-radius: 4px;
      cursor: pointer;
      font-size: .88rem;
      transition: all .18s;
    }
    .btn-rec:hover { background: rgba(201,162,39,.1); }

    .disclaimer {
      font-size: .73rem;
      color: var(--text-dim);
      border: 1px solid #2a2a44;
      border-radius: 4px;
      padding: .55rem .8rem;
      margin-top: .75rem;
      line-height: 1.5;
    }

    /* ─── 傾向ピッカー ─── */
    .picker-panel {
      background: var(--bg2);
      border: 1px solid #3a3a60;
      border-radius: 8px;
      margin: 1rem 0;
      overflow: hidden;
    }
    .picker-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: .65rem 1rem;
      cursor: pointer;
      font-size: .9rem;
      color: var(--gold);
      user-select: none;
      border-bottom: 1px solid transparent;
      transition: background .15s;
    }
    .picker-header:hover { background: rgba(201,162,39,.07); }
    .picker-header.open  { border-bottom-color: #2a2a44; }
    .picker-body { display: none; padding: .9rem 1rem 1rem; }
    .picker-body.open { display: block; }

    .picker-row {
      display: flex;
      align-items: center;
      gap: .5rem;
      margin-bottom: .65rem;
      flex-wrap: wrap;
    }
    .picker-lbl {
      width: 56px;
      font-size: .75rem;
      color: var(--text-dim);
      text-align: right;
      flex-shrink: 0;
    }
    .picker-digits { display: flex; gap: .3rem; flex-wrap: wrap; }

    .pd-btn {
      width: 46px; height: 44px;
      border-radius: 6px;
      border: 2px solid transparent;
      background: #141428;
      color: #aaa;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-size: .9rem;
      font-weight: bold;
      font-family: 'Courier New', monospace;
      transition: all .14s;
      position: relative;
    }
    .pd-btn .pd-cnt {
      font-size: .58rem;
      font-family: sans-serif;
      font-weight: normal;
      color: rgba(255,255,255,.45);
      line-height: 1;
    }
    /* 頻度に応じた背景色 */
    .pd-f1 { background: #1e1e40; color: #9090d0; }
    .pd-f2 { background: #3a2808; color: var(--gold); }
    .pd-f3 { background: #5a3c04; color: var(--gold-lt); }
    .pd-f4 { background: #7a5000; color: #fff; }
    /* 選択状態 */
    .pd-btn.chosen {
      border-color: var(--gold);
      box-shadow: 0 0 8px rgba(201,162,39,.5);
      transform: scale(1.08);
    }
    .pd-btn:hover:not(.chosen) { border-color: #555; transform: scale(1.04); }

    .picker-preview {
      display: flex;
      align-items: center;
      gap: .8rem;
      margin-top: .5rem;
      padding-top: .65rem;
      border-top: 1px solid #2a2a44;
      flex-wrap: wrap;
    }
    .preview-num {
      font-family: 'Courier New', monospace;
      font-size: 1.8rem;
      font-weight: bold;
      color: var(--gold);
      letter-spacing: .25em;
      min-width: 100px;
    }
    .preview-num .blank { color: #333; }
    .btn-apply {
      padding: .45rem 1.1rem;
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      border-radius: 4px;
      cursor: pointer;
      font-size: .82rem;
      transition: all .18s;
    }
    .btn-apply:hover { background: rgba(201,162,39,.12); }
    .btn-apply:disabled { opacity: .3; cursor: not-allowed; }
    .btn-clear-pick {
      padding: .4rem .8rem;
      background: transparent;
      border: 1px solid #444;
      color: #666;
      border-radius: 4px;
      cursor: pointer;
      font-size: .78rem;
    }

    /* インサイトリスト */
    .insight-list { display: flex; flex-direction: column; gap: .6rem; }
    .insight-row {
      display: flex;
      gap: .8rem;
      align-items: baseline;
      background: #111128;
      border: 1px solid #2a2a44;
      border-radius: 6px;
      padding: .6rem .85rem;
    }
    .insight-pos {
      font-size: .72rem;
      color: var(--text-dim);
      white-space: nowrap;
      width: 74px;
      flex-shrink: 0;
    }
    .insight-body { font-size: .85rem; line-height: 1.5; }
    .insight-body em { color: var(--gold); font-style: normal; }

    /* ─── エクスポート ─── */
    .export-section {
      text-align: center;
      margin-top: 2rem;
      padding-top: 1.2rem;
      border-top: 1px solid #2a2a44;
    }
    .btn-export {
      background: transparent;
      border: 1px solid #5a7a5a;
      color: #88bb88;
      padding: .55rem 1.4rem;
      border-radius: 6px;
      cursor: pointer;
      font-size: .88rem;
      transition: all .18s;
    }
    .btn-export:hover { background: rgba(100,180,100,.1); border-color: #88bb88; }
    .export-hint { font-size: .72rem; color: var(--text-dim); margin-top: .4rem; }

    /* レスポンシブ */
    @media (max-width: 560px) {
      header h1 { font-size: 1.2rem; }
      .digit-box { width: 52px; height: 68px; font-size: 1.8rem; }
      .btn-draw { font-size: 1.1rem; padding: .8rem 2rem; }
    }
  </style>
</head>
<body>

<header>
  <h1>⚔️ ノマドモグボナンザ 購入番号サポート</h1>
  <p>24周年記念（2026年）FF11 モグボナンザ</p>
</header>

<div class="tabs">
  <button class="tab-btn active" onclick="switchTab('sim')">🎯 番号を選ぶ</button>
  <button class="tab-btn"        onclick="switchTab('trend')">📊 傾向分析</button>
</div>

<!-- ════════════════════════════════════════════════════ 抽選タブ -->
<div id="tab-sim" class="tab-content active">
  <div class="container">

    <div class="info-bar">
      <span>💰 玉1個: <strong>200,000ギル</strong></span>
      <span>🛒 販売期間: <strong>5/14〜5/26</strong></span>
      <span>📅 当選発表: <strong>6/24</strong></span>
      <span>🎯 上限: <strong>1キャラ2個まで</strong></span>
    </div>

    <div class="char-list" id="charList"></div>

    <button class="btn-add-char" onclick="addChar()">＋ キャラクターを追加</button>

    <div class="picker-panel" id="pickerPanel">
      <div class="picker-header" id="pickerHeader" onclick="togglePicker()">
        🎯 傾向から番号を選ぶ
        <span id="pickerArrow">▼</span>
      </div>
      <div class="picker-body" id="pickerBody"></div>
    </div>

    <div class="draw-section">
      <button class="btn-draw" id="drawBtn" onclick="startDraw()">🎰 抽選！</button>
    </div>

    <div class="winning-display" id="winDisp" style="display:none">
      <div class="winning-label">当 選 番 号</div>
      <div class="winning-digits">
        <div class="digit-box" id="d0">?</div>
        <div class="digit-box" id="d1">?</div>
        <div class="digit-box" id="d2">?</div>
      </div>
    </div>

    <div class="results-section" id="resultsSec"></div>

    <div class="export-section">
      <button class="btn-export" onclick="exportMarkdown()">📋 購入番号をMarkdownで保存</button>
      <div class="export-hint">入力中のキャラ・番号を .md ファイルに書き出します</div>
    </div>

  </div>
</div>

<!-- ════════════════════════════════════════════════════ 傾向分析タブ -->
<div id="tab-trend" class="tab-content">
  <div class="container">
    <div id="trendBody"></div>
  </div>
</div>

<script>

// ────────────────────────────────────────────

  { year:'第3回 新春2021',  first:'397', second:'79', third:'1' },

// ────────────────────────────────────────────
// キャラ管理
// ────────────────────────────────────────────

let uid = 0;

function addChar(name = '') {
  const id = uid++;
  const div = document.createElement('div');
  div.className = 'char-card';
  div.id = `char-${id}`;
  div.innerHTML = `
    <div class="char-header">
      <input class="char-name-input" type="text" placeholder="キャラ名（任意）" value="${escHtml(name)}">
      <button class="btn-remove" onclick="removeChar(${id})">✕ 削除</button>
    </div>
    <div class="marbles-row">
      <div class="marble-group">
        <span class="marble-label">玉&nbsp;①</span>
        <input class="marble-input" type="text" maxlength="3" placeholder="000" inputmode="numeric">
      </div>
      <div class="marble-group">
        <span class="marble-label">玉&nbsp;②</span>
        <input class="marble-input" type="text" maxlength="3" placeholder="---" inputmode="numeric">
      </div>
    </div>`;
  div.querySelectorAll('.marble-input').forEach(el => {
    el.addEventListener('input', () => { el.value = el.value.replace(/\D/g,'').slice(0,3); });
  });
  document.getElementById('charList').appendChild(div);
}

function removeChar(id) {
  const el = document.getElementById(`char-${id}`);
  if (el) el.remove();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ────────────────────────────────────────────
// 等級判定
// ────────────────────────────────────────────

function checkTier(marble, winning) {
  const m = marble.padStart(3,'0');
  const w = winning.padStart(3,'0');
  if (m === w)           return 1;
  if (m.slice(1) === w.slice(1)) return 2;
  if (m[2] === w[2])     return 3;
  return 4;
}

// ────────────────────────────────────────────
// 抽選アニメーション
// ────────────────────────────────────────────

function startDraw() {
  const chars = document.querySelectorAll('.char-card');
  if (!chars.length) { alert('キャラクターを追加してください'); return; }

  const btn = document.getElementById('drawBtn');
  btn.disabled = true;

  const winning = String(Math.floor(Math.random() * 1000)).padStart(3,'0');
  document.getElementById('winDisp').style.display = 'block';
  document.getElementById('resultsSec').innerHTML = '';

  const dEls = ['d0','d1','d2'].map(id => document.getElementById(id));
  dEls.forEach(el => { el.textContent = '?'; el.classList.add('spin'); });

  const TOTAL = 28;
  const LOCK  = [TOTAL - 9, TOTAL - 5, TOTAL];
  let f = 0;

  const iv = setInterval(() => {
    f++;
    dEls.forEach((el, i) => {
      if (f < LOCK[i]) {
        el.textContent = Math.floor(Math.random() * 10);
      } else {
        el.textContent = winning[i];
        el.classList.remove('spin');
      }
    });
    if (f >= TOTAL) {
      clearInterval(iv);
      setTimeout(() => { showResults(winning); btn.disabled = false; }, 320);
    }
  }, 58);
}

// ────────────────────────────────────────────
// 結果表示
// ────────────────────────────────────────────

function showResults(winning) {
  const sec = document.getElementById('resultsSec');
  sec.innerHTML = '';

  document.querySelectorAll('.char-card').forEach(card => {
    const name = card.querySelector('.char-name-input').value.trim() || 'キャラ';
    card.querySelectorAll('.marble-input').forEach((inp, idx) => {
      const val = inp.value.trim();
      if (!val) return;

      const marble = val.padStart(3,'0');
      const tier   = checkTier(marble, winning);
      const pid    = `pg-${name}-${idx}`;

      const div = document.createElement('div');
      div.className = `result-card ${TIER_CLASS[tier]}`;
      div.innerHTML = `
        <div class="result-header">
          <span class="tier-badge">${TIER_NAME[tier]}</span>
          <span style="font-size:.88rem">${escHtml(name)}&nbsp;玉${idx+1}</span>
          <span class="marble-vs">${matchHtml(marble, winning)}</span>
        </div>
        ${tier < 4 ? `
          <div style="color:var(--text-dim);font-size:.85rem;padding:.4rem 0;font-style:italic">
            🗓️ 景品は当選発表（2026/6/24）後に確認できます
          </div>
        ` : `
          <div style="color:var(--text-dim);font-size:.88rem;padding:.25rem 0">
            🎱 ボナンザボール を獲得
          </div>
        `}`;
      sec.appendChild(div);
    });
  });
}

function matchHtml(marble, winning) {
  return marble.split('').map((d, i) =>
    d === winning[i]
      ? `<span style="color:var(--gold-lt);font-weight:bold">${d}</span>`
      : `<span style="color:#555">${d}</span>`
  ).join('') + `&nbsp;<span style="color:#444">vs</span>&nbsp;<span style="color:#888">${winning}</span>`;
}

function pickRand(pid) {
  const grid  = document.getElementById(pid);
  const chips = grid.querySelectorAll('.prize-chip');
  chips.forEach(c => c.classList.remove('chosen'));
  const pick = chips[Math.floor(Math.random() * chips.length)];
  pick.classList.add('chosen');
  pick.scrollIntoView({ behavior:'smooth', block:'nearest' });
}

// ────────────────────────────────────────────
// タブ切り替え
// ────────────────────────────────────────────

function switchTab(id) {
  ['sim','trend'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.toggle('active', t === id);
  });
  document.querySelectorAll('.tab-btn').forEach((b, i) =>
    b.classList.toggle('active', ['sim','trend'][i] === id));
  if (id === 'trend') buildTrend();
}

// ────────────────────────────────────────────
// 傾向分析
// ────────────────────────────────────────────

function digitFreq() {
  const freq = [{},{},{}];
  for (let d = 0; d <= 9; d++) [0,1,2].forEach(i => { freq[i][d] = 0; });
  HISTORY.forEach(h => {
    h.first.padStart(3,'0').split('').forEach((ch, i) => { freq[i][ch] = (freq[i][ch]||0) + 1; });
  });
  return freq;
}

function buildTrend() {
  const freq   = digitFreq();
  const posLbl = ['百の位','十の位','一の位'];
  const maxF   = Math.max(...freq.flatMap(f => Object.values(f)));

  // 過去当選テーブル
  const rows = HISTORY.map(h =>
    `<tr>
       <td>${h.year}</td>
       <td><span class="num-hl">${h.first}</span></td>
       <td>${h.second}</td>
       <td>${h.third}</td>
     </tr>`
  ).join('');

  // ヒートマップ
  const hmRows = freq.map((f, pi) => {
    const cells = Object.entries(f).map(([d, cnt]) => {
      const ratio = maxF > 0 ? cnt / maxF : 0;
      const cls   = ratio === 0 ? 'hm-0' : ratio <= .5 ? 'hm-1' : 'hm-2';
      return `<div class="hm-cell ${cls}"><span class="hm-d">${d}</span><span class="hm-c">${cnt}回</span></div>`;
    }).join('');
    return `<div class="heatmap-row"><span class="heatmap-lbl">${posLbl[pi]}</span><div class="heatmap-cells">${cells}</div></div>`;
  }).join('');

  // ホット/コールド
  const hcHtml = freq.map((f, pi) => {
    const max  = Math.max(...Object.values(f));
    const hot  = Object.keys(f).filter(k => f[k] === max && max > 0);
    const cold = Object.keys(f).filter(k => f[k] === 0);
    const coldDisp = cold.length > 5
      ? cold.slice(0,5).map(d=>`<span class="badge cold">❄ ${d}</span>`).join('') + `<span style="font-size:.72rem;color:var(--text-dim)"> 他${cold.length-5}個</span>`
      : cold.map(d=>`<span class="badge cold">❄ ${d}</span>`).join('');
    return `<div style="margin-bottom:.6rem">
      <span style="font-size:.78rem;color:var(--text-dim)">${posLbl[pi]}：</span>
      ${hot.map(d=>`<span class="badge hot">🔥 ${d}</span>`).join('')}
      ${coldDisp}
    </div>`;
  }).join('');

  // ── インサイト生成 ──
  const n = HISTORY.length;
  const insightItems = [];

  // 各桁でトップの数字と出現率を調べてコメント化
  freq.forEach((f, pi) => {
    const max  = Math.max(...Object.values(f));
    const hot  = Object.keys(f).filter(k => f[k] === max);
    const pct  = Math.round(max / n * 100);
    const lbl  = ['百の位','十の位','一の位'][pi];
    const theory = 10;
    if (max >= 2) {
      const ratio = (pct / theory).toFixed(1);
      insightItems.push(
        `<div class="insight-row">
          <span class="insight-pos">${lbl}</span>
          <span class="insight-body">
            <strong style="color:var(--gold-lt)">${hot.join(' / ')}</strong> が
            ${max}/${n}回 <em>(${pct}%)</em> 出現 ─ 理論値(10%)の約${ratio}倍
          </span>
        </div>`
      );
    }
  });

  // 百の位+十の位の組み合わせトップ
  const combos = {};
  HISTORY.forEach(h => {
    const k = h.first.padStart(3,'0').slice(0,2);
    combos[k] = (combos[k] || 0) + 1;
  });
  const topCombo = Object.entries(combos).sort((a,b) => b[1]-a[1])[0];
  if (topCombo[1] >= 2) {
    insightItems.push(
      `<div class="insight-row">
        <span class="insight-pos">上2桁</span>
        <span class="insight-body">
          <strong style="color:var(--gold-lt)">${topCombo[0]}X</strong> が
          ${topCombo[1]}/${n}回出現（${Math.round(topCombo[1]/n*100)}%）─ 最多の上2桁パターン
        </span>
      </div>`
    );
  }

  // 3等一の位
  const thirdFreq = {};
  for (let d=0; d<=9; d++) thirdFreq[d] = 0;
  HISTORY.forEach(h => { const d = h.third.slice(-1); thirdFreq[d]++; });
  const thirdMax  = Math.max(...Object.values(thirdFreq));
  const thirdHot  = Object.keys(thirdFreq).filter(k => thirdFreq[k] === thirdMax);
  insightItems.push(
    `<div class="insight-row">
      <span class="insight-pos">3等(一の位)</span>
      <span class="insight-body">
        <strong style="color:var(--bronze)">${thirdHot.join(' / ')}</strong> が各${thirdMax}回出現
        ─ 下1桁が一致すると3等。一の位選択の参考に
      </span>
    </div>`
  );

  const insightHtml = `
    <div class="insight-list">${insightItems.join('')}</div>`;

  document.getElementById('trendBody').innerHTML = `
    <div class="trend-section">
      <h2>📋 過去の当選番号（参考）</h2>
      <table class="history-table">
        <thead><tr><th>回</th><th>1等（全3桁）</th><th>2等（下2桁）</th><th>3等（下1桁）</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>

    <div class="trend-section">
      <h2>🌡 桁別出現頻度ヒートマップ（1等 全${HISTORY.length}回）</h2>
      <div class="heatmap">${hmRows}</div>
      <div style="font-size:.72rem;color:var(--text-dim);margin-top:.5rem">
        🟣 薄紫=1回出現　🟠 オレンジ=最頻出
      </div>
    </div>

    <div class="trend-section">
      <h2>🔥 ホット / ❄ コールド数字</h2>
      ${hcHtml}
    </div>

    <div class="trend-section">
      <h2>💡 注目インサイト（全${HISTORY.length}回 分析）</h2>
      ${insightHtml}
    </div>

    <div class="trend-section">
      <h2>🎯 おすすめ番号（傾向ベース）</h2>
      <div class="rec-box">
        <div style="font-size:.82rem;color:var(--text-dim)">各桁の最頻出数字を採用（同率の場合はランダム）</div>
        <span class="rec-num" id="recNum">─ ─ ─</span>
        <button class="btn-rec" onclick="genRec()">おすすめ番号を生成</button>
      </div>
      <div class="disclaimer">
        ⚠️ このデータはエンタメ目的です。ボナンザの抽選は真のランダムであり、過去の当選番号は次回の結果に一切影響しません。
        ${HISTORY.length}回分のサンプルでも真のランダム抽選に対して統計的有意性はありません。あくまでも参考程度にお楽しみください。
      </div>
    </div>`;
}

function genRec() {
  const freq = digitFreq();
  const rec  = freq.map(f => {
    const max = Math.max(...Object.values(f));
    const hot = Object.keys(f).filter(k => f[k] === max);
    return hot[Math.floor(Math.random() * hot.length)];
  }).join('');
  document.getElementById('recNum').textContent = rec.split('').join(' ');
}

// ────────────────────────────────────────────
// Markdownエクスポート
// ────────────────────────────────────────────

function exportMarkdown() {
  const now    = new Date();
  const dateStr = `${now.getFullYear()}/${String(now.getMonth()+1).padStart(2,'0')}/${String(now.getDate()).padStart(2,'0')}`;
  const timeStr = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
  const fname   = `bonanza_${now.getFullYear()}${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}.md`;

  // キャラ・玉データ収集
  const chars = [];
  document.querySelectorAll('.char-card').forEach(card => {
    const name    = card.querySelector('.char-name-input').value.trim() || '（名前なし）';
    const inputs  = card.querySelectorAll('.marble-input');
    const marble1 = inputs[0]?.value.trim().padStart(3,'0') || '---';
    const marble2 = inputs[1]?.value.trim() ? inputs[1].value.trim().padStart(3,'0') : '---';
    chars.push({ name, marble1, marble2 });
  });

  if (chars.length === 0 || chars.every(c => c.marble1 === '---' && c.marble2 === '---')) {
    alert('玉番号が入力されていません');
    return;
  }

  // 傾向サマリー
  const freq   = digitFreq();
  const posLbl = ['百の位', '十の位', '一の位'];
  const trendLines = freq.map((f, pi) => {
    const max = Math.max(...Object.values(f));
    const hot = Object.keys(f).filter(k => f[k] === max && max > 0);
    const pct = Math.round(max / HISTORY.length * 100);
    return `- ${posLbl[pi]}: \`${hot.join(' / ')}\` が最頻出（${max}/${HISTORY.length}回, ${pct}%）`;
  }).join('\n');

  // テーブル行
  const tableRows = chars.map(c =>
    `| ${c.name} | ${c.marble1 !== '---' ? `\`${c.marble1}\`` : '─'} | ${c.marble2 !== '---' ? `\`${c.marble2}\`` : '─'} |`
  ).join('\n');

  const md = `# ノマドモグボナンザ 購入記録

**イベント:** 24周年記念ノマドモグボナンザ
**販売期間:** 2026/05/14 〜 05/26
**当選番号発表:** 2026/06/24
**エクスポート:** ${dateStr} ${timeStr}

---

## 購入番号

| キャラ | 玉① | 玉② |
|--------|------|------|
${tableRows}

---

## 傾向分析メモ（参考 / 全${HISTORY.length}回データ）

${trendLines}

> ⚠️ 傾向データはエンタメ目的です。抽選は真のランダムであり予測はできません。

---

## 過去の当選番号

| 回 | 1等（全3桁） | 2等（下2桁） | 3等（下1桁） |
|----|------------|------------|------------|
${HISTORY.map(h => `| ${h.year} | \`${h.first}\` | ${h.second} | ${h.third} |`).join('\n')}
`;

  // ダウンロード
  const blob = new Blob([md], { type: 'text/markdown;charset=utf-8' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = fname;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

// ────────────────────────────────────────────
// 傾向ピッカー
// ────────────────────────────────────────────

const pickerSel = [null, null, null]; // 選択中の桁 [百,十,一]

function togglePicker() {
  const body   = document.getElementById('pickerBody');
  const header = document.getElementById('pickerHeader');
  const arrow  = document.getElementById('pickerArrow');
  const isOpen = body.classList.contains('open');
  body.classList.toggle('open', !isOpen);
  header.classList.toggle('open', !isOpen);
  arrow.textContent = isOpen ? '▼' : '▲';
  if (!isOpen && !body.hasChildNodes()) buildPickerUI();
}

function buildPickerUI() {
  const freq    = digitFreq();
  const posLbls = ['百の位', '十の位', '一の位'];
  const maxF    = Math.max(...freq.flatMap(f => Object.values(f)));

  let html = '';
  freq.forEach((f, pi) => {
    // 頻度順にソート（同率は数字の小さい順）
    const sorted = Object.entries(f)
      .sort((a, b) => b[1] - a[1] || a[0] - b[0]);

    const buttons = sorted.map(([d, cnt]) => {
      const lvl = cnt === 0 ? 0 : cnt === 1 ? 1 : cnt <= 2 ? 2 : cnt <= 3 ? 3 : 4;
      return `<button class="pd-btn pd-f${lvl}" data-pos="${pi}" data-digit="${d}"
                onclick="pickDigit(${pi},'${d}')">
                ${d}<span class="pd-cnt">${cnt}回</span>
              </button>`;
    }).join('');

    html += `<div class="picker-row">
      <span class="picker-lbl">${posLbls[pi]}</span>
      <div class="picker-digits" id="pdRow${pi}">${buttons}</div>
    </div>`;
  });

  html += `<div class="picker-preview">
    <span class="preview-num" id="prevNum">
      <span id="pn0" class="blank">?</span>
      <span id="pn1" class="blank">?</span>
      <span id="pn2" class="blank">?</span>
    </span>
    <button class="btn-apply" id="btnApply" onclick="applyPicker()" disabled>
      空き玉番号に適用
    </button>
    <button class="btn-clear-pick" onclick="clearPicker()">クリア</button>
  </div>`;

  document.getElementById('pickerBody').innerHTML = html;
}

function pickDigit(pos, digit) {
  // 同じ桁を再クリックで解除
  pickerSel[pos] = pickerSel[pos] === digit ? null : digit;

  // ボタン選択状態更新
  document.querySelectorAll(`#pdRow${pos} .pd-btn`).forEach(btn => {
    btn.classList.toggle('chosen', btn.dataset.digit === pickerSel[pos]);
  });

  // プレビュー更新
  ['pn0','pn1','pn2'].forEach((id, i) => {
    const el = document.getElementById(id);
    if (pickerSel[i] !== null) {
      el.textContent = pickerSel[i];
      el.classList.remove('blank');
    } else {
      el.textContent = '?';
      el.classList.add('blank');
    }
  });

  // 適用ボタン：1桁以上選択されていれば有効
  document.getElementById('btnApply').disabled = pickerSel.every(v => v === null);
}

function applyPicker() {
  // 選択されていない桁はランダム
  const num = pickerSel.map(v => v !== null ? v : String(Math.floor(Math.random() * 10))).join('');

  // 最初の空き marble-input に入力
  const inputs = document.querySelectorAll('.marble-input');
  for (const inp of inputs) {
    if (!inp.value.trim()) {
      inp.value = num;
      inp.focus();
      inp.style.transition = 'box-shadow .3s';
      inp.style.boxShadow  = '0 0 10px rgba(201,162,39,.8)';
      setTimeout(() => { inp.style.boxShadow = ''; }, 800);
      return;
    }
  }
  // 全て埋まっていれば最後のに上書き
  const last = inputs[inputs.length - 1];
  if (last) { last.value = num; last.focus(); }
}

function clearPicker() {
  pickerSel.fill(null);
  document.querySelectorAll('.pd-btn').forEach(b => b.classList.remove('chosen'));
  ['pn0','pn1','pn2'].forEach(id => {
    const el = document.getElementById(id);
    el.textContent = '?';
    el.classList.add('blank');
  });
  document.getElementById('btnApply').disabled = true;
}

// ────────────────────────────────────────────
addChar();
